name: MoonBit community checks

on:
  workflow_dispatch:
  push:
    branches: [master]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
          echo "$HOME/.moon-latest/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.moon/bin:$HOME/.moon-latest/bin:$PATH"
          moon version --all
          moonc -v | grep -Eq 'v0\.10\.(9|[1-9][0-9])' || { echo 'Moonc >= v0.10.9 is required'; exit 1; }
      - name: Verify repository
        run: |
          moon fmt --check
          git diff --exit-code
          moon info
          git diff --exit-code
          moon check --target all --deny-warn
          moon test --target all --deny-warn
          moon run cmd/moonbit-tradeclass --target native
