name: MoonBit checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: moonbit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: stable / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install MoonBit stable (Unix)
        if: runner.os != 'Windows'
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
          echo "$HOME/.moon-latest/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.moon/bin:$HOME/.moon-latest/bin:$PATH"
          moon version --all

      - name: Install MoonBit stable (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          @("$HOME/.moon/bin", "$HOME/.moon-latest/bin", "C:\Users\runneradmin\.moon\bin", "C:\Users\runneradmin\.moon-latest\bin") | Out-File -FilePath $env:GITHUB_PATH -Append
          $env:Path = "$HOME\.moon\bin;$HOME\.moon-latest\bin;C:\Users\runneradmin\.moon\bin;C:\Users\runneradmin\.moon-latest\bin;$env:Path"
          moon version --all

      - name: Format
        run: moon fmt --check

      - name: Public interface check
        run: |
          moon info
          git diff --exit-code

      - name: All-target type check and tests
        run: |
          moon check --target all --deny-warn
          moon test --target all --deny-warn

      - name: CLI smoke test
        run: moon run cmd/moonbit-tradeclass --target native
